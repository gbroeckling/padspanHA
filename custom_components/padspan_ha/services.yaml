set_room_tag_map:
  name: "Set Room Tag Map"
  description: "Replace the curated room_tag_map (room name → list of object keys). Persisted across restarts."
  fields:
    room_tag_map:
      required: true
      selector:
        object:

dump_devices:
  name: "Dump Devices"
  description: >
    Returns all tracked BLE devices with current room, RSSI, age, and smoothing state.
    Equivalent to Bermuda BLE Trilateration dump_devices service. Supports response data for
    use in templates, scripts, and automations. Also creates a persistent notification.
  fields:
    notify:
      description: "Create a persistent notification summary in HA (default true)."
      default: true
      selector:
        boolean:

wled_on:
  name: "WLED on with its look"
  description: >
    Turns WLED lights on with the look PadSpan remembered for them (every part, colour, white,
    effect and brightness), exactly and with no flash. A light PadSpan doesn't run is turned on
    by Home Assistant as usual.
  target:
    entity:
      integration: wled
      domain: light
  fields:
    brightness_pct:
      description: "Brightness in percent. Leave empty for the remembered brightness."
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    transition:
      description: "Fade time in seconds. Leave empty for the remembered fade."
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: "s"

wled_off:
  name: "WLED off"
  description: >
    Turns WLED lights off the way PadSpan does: only the light as a whole goes off, so its
    remembered look is there the next time it comes on.
  target:
    entity:
      integration: wled
      domain: light
  fields:
    transition:
      description: "Fade time in seconds. Leave empty for the remembered fade."
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: "s"

reload_screens:
  name: "Reload screens"
  description: >
    Loads the open PadSpan pages again (wall tablets, TVs, desktops), so new code reaches a
    screen nobody is standing at. Needs Settings → Atlas → Open screens switched on.
  fields:
    screens:
      description: "Names or ids of the screens to reload (Settings → Atlas → Open screens). Leave empty for every screen."
      selector:
        text:
          multiple: true

announce:
  name: "Announce on screens"
  description: >
    Shows a message big over the open PadSpan pages for a few seconds, with a chime, and reads
    it aloud if asked. Needs Settings → Atlas → Open screens switched on.
  fields:
    message:
      required: true
      description: "What to show (up to 300 characters)."
      example: "Someone is at the door"
      selector:
        text:
    title:
      description: "A short line above the message."
      example: "Doorbell"
      selector:
        text:
    screens:
      description: "Names or ids of the screens to show it on. Leave empty for every screen."
      selector:
        text:
          multiple: true
    seconds:
      description: "How long it stays up."
      default: 15
      selector:
        number:
          min: 3
          max: 300
          unit_of_measurement: "s"
    chime:
      description: "Play a short chime first."
      default: true
      selector:
        boolean:
    speak:
      description: "Read the message aloud with the screen's own browser voice."
      default: false
      selector:
        boolean:
