set_room_tag_map:
  name: "Set Room Tag Map"
  description: "Replace the curated room_tag_map (room name → list of object keys). Persisted across restarts."
  fields:
    room_tag_map:
      required: true
      selector:
        object:

dump_devices:
  name: "Dump Devices"
  description: >
    Returns all tracked BLE devices with current room, RSSI, age, and smoothing state.
    Equivalent to Bermuda BLE Trilateration dump_devices service. Supports response data for
    use in templates, scripts, and automations. Also creates a persistent notification.
  target:
  fields:
    notify:
      description: "Create a persistent notification summary in HA (default true)."
      default: true
      selector:
        boolean:

wled_on:
  name: "WLED on with its look"
  description: >
    Turns WLED lights on with the look PadSpan remembered for them (every part, colour, white,
    effect and brightness), exactly and with no flash. A light PadSpan doesn't run is turned on
    by Home Assistant as usual.
  target:
    entity:
      integration: wled
      domain: light
  fields:
    brightness_pct:
      description: "Brightness in percent. Leave empty for the remembered brightness."
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    transition:
      description: "Fade time in seconds. Leave empty for the remembered fade."
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: "s"

wled_off:
  name: "WLED off"
  description: >
    Turns WLED lights off the way PadSpan does: only the light as a whole goes off, so its
    remembered look is there the next time it comes on.
  target:
    entity:
      integration: wled
      domain: light
  fields:
    transition:
      description: "Fade time in seconds. Leave empty for the remembered fade."
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: "s"
