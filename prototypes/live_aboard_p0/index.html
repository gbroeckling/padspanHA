<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (s) => document.querySelector(s);
const clamp = THREE.MathUtils.clamp;
const D2R = Math.PI / 180;
const Y_AXIS = new THREE.Vector3(0, 1, 0);

/* ───────── Tunables (metres) ───────── */
const SLAB_T = 0.15;                      // slab under every room tile
const SHARE_TOL = 0.65;                   // two parallel, facing room edges this close are ONE wall (the gap is its thickness)
const SHARE_COS = Math.cos(6 * D2R);      // ...and no more than 6° apart
const BEHIND = 2.0;                       // a lone edge with an indoor room this close behind it is an inside wall (unmapped halls)
const EXT_T = 0.14, MIN_T = 0.10;         // exterior wall thickness, thinnest shared wall
const CUT_H = 0.42;                       // height of a cut-away wall
const BAR_TOL = 0.40, BAR_COS = Math.cos(8 * D2R); // a barrier this close to a wall's centre line replaces that stretch
const DOOR_H = 2.05, SILL_H = 0.9, HEAD_H = 2.1, RAIL_H = 1.0, FTF = 2.8;
const OUTDOOR_RE = /\b(deck|patio|porch|balcony|terrace|veranda|yard|garden|lawn|driveway|outside|outdoor)\b/i;
const FLOOR_DOTS = ['#34b47f', '#f59e0b', '#5b8def', '#c084fc', '#f472b6'];
const FOV = 40;
const QUALITY = {
  low:  { dpr: () => 1, shadows: false, lamps: 4, std: false },
  high: { dpr: () => Math.min(window.devicePixelRatio || 1, 3), shadows: true, lamps: 8, std: true },
};
const MAT_TINT = { metal: '#9eabb6', concrete: '#aaa69d', brick: '#a8644c', stone: '#9d978b', wood: '#a37c58', tile: '#b9b4aa' };
const WALL_EXT = '#d6cfc2', WALL_INT = '#ebe6dd', DOOR_COL = '#8b6a4f', GARAGE_DOOR_COL = '#c3c9d0';
const SLAB_SIDE = '#c8b18c', EARTH_SIDE = '#4a3f33';

const state = { quality: 'high', wallMode: 'cut', top: null, selected: null, drag: null, frames: 0 };

/* ───────── Small helpers ───────── */
const num = (v) => (v === null || v === undefined || v === '' ? null : (Number.isFinite(+v) ? +v : null));
const fid = (id) => String(id ?? '').replace(/^_+|_+$/g, '');   // rooms say "__outside__", floors say "outside"
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const unit = (v) => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const perp = (v) => [-v[1], v[0]];
const yawOf = (v) => Math.atan2(-v[1], v[0]);                     // plan direction -> rotation about +Y
function signedArea(P) { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
function inPoly(x, y, P) {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const a = P[i], b = P[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
function segDist(x, y, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  const t = L2 ? clamp(((x - ax) * dx + (y - ay) * dy) / L2, 0, 1) : 0;
  return [Math.hypot(x - ax - dx * t, y - ay - dy * t), t];
}
function cleanPoly(raw) {
  const out = [];
  for (const p of raw) {
    if (!Array.isArray(p) || num(p[0]) === null || num(p[1]) === null) continue;
    const q = [+p[0], +p[1]];
    if (!out.length || dist(out[out.length - 1], q) > 0.02) out.push(q);
  }
  while (out.length > 3 && dist(out[0], out[out.length - 1]) < 0.2) out.pop();   // hand-drawn closing point
  if (signedArea(out) < 0) out.reverse();                                        // CCW in plan: outward normal = (dy, -dx)
  return out;
}
function labelSpot(P) {   // the inside point farthest from every edge, and that distance
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of P) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  const step = Math.max(0.1, Math.min(x1 - x0, y1 - y0) / 30);
  let best = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, r: 0.3 };
  for (let x = x0 + step / 2; x < x1; x += step) {
    for (let y = y0 + step / 2; y < y1; y += step) {
      if (!inPoly(x, y, P)) continue;
      let r = Infinity;
      for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; r = Math.min(r, segDist(x, y, a[0], a[1], b[0], b[1])[0]); }
      if (r > best.r) best = { x, y, r };
    }
  }
  return best;
}
function hash32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
// PadSpan's own room colour (views/room_color.js): a room_meta colour wins, else a hue from the room name.
function roomColor(name, model) {
  const meta = model.room_meta && model.room_meta[name];
  if (meta && typeof meta.color === 'string' && /^#[0-9a-f]{3,8}$/i.test(meta.color)) return new THREE.Color(meta.color);
  return new THREE.Color().setHSL((hash32(String(name)) % 360) / 360, 0.70, 0.55, THREE.SRGBColorSpace);
}
function kelvinRGB(k) {   // colour temperature -> sRGB 0..255 (the usual black-body curve fit)
  const t = clamp(k, 1000, 40000) / 100;
  let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708 * Math.log(t) - 161.1196; b = t <= 19 ? 0 : 138.5177 * Math.log(t - 10) - 305.0448; }
  else { r = 329.6987 * Math.pow(t - 60, -0.1332); g = 288.1222 * Math.pow(t - 60, -0.0755); b = 255; }
  return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
}

/* ───────── Fixture kinds: PadSpan's own name rule (light_codes.js deriveLightShape), same precedence ───────── */
function lightKind(eid, friendly) {
  const t = `${eid} ${friendly}`.toLowerCase();
  const has = (...w) => w.some((x) => t.includes(x));
  if (has('fan')) return 'fan';
  if (has('chandelier')) return 'chandelier';
  if (has('pendant', 'hanging', 'drop light')) return 'pendant';
  if (has('sconce', 'wall light', 'wall lamp', 'vanity')) return 'sconce';
  if (has('spot', 'flood', 'wall wash', 'washer')) return 'spot';
  if (has('status led', 'status_led', 'backlight', 'indicator')) return 'led';
  if (has('pot', 'downlight', 'down light', 'recessed', 'can light')) return 'pot';
  if (has('track')) return 'track';
  if (has('valance', 'strip', 'cove', 'tape', 'rope', 'under cab', 'undercab', 'wled', 'led controller', 'led-controller',
          'ws2812', 'sk6812', 'neopixel', 'xmas', 'christmas')) return 'strip';
  if (has('flouresent', 'fluorescent', 'tube', 'shop light')) return 'tube';
  return 'fixture';
}
// width_cm/height_cm/rotation are drawn in the Atlas's isometric screen frame (x' = (x-y)cos30, y' = (x+y)sin30),
// so map the footprint's two axes back into plan metres.
const C30 = Math.cos(Math.PI / 6);
const isoToPlan = (sx, sy) => [sx / (2 * C30) + sy, -sx / (2 * C30) + sy];
function footprint(lp) {
  const w = (num(lp.width_cm) || 0) / 100, h = (num(lp.height_cm) || 0) / 100;
  if (Math.max(w, h) < 0.3) return null;                 // 1×1 and 15×15 cm markers carry no real size
  const t = (num(lp.rotation) || 0) * D2R;
  const e1 = isoToPlan(Math.cos(t), Math.sin(t)), e2 = isoToPlan(-Math.sin(t), Math.cos(t));
  const p1 = [e1[0] * w / 2, e1[1] * w / 2], p2 = [e2[0] * h / 2, e2[1] * h / 2];
  const l1 = 2 * Math.hypot(p1[0], p1[1]), l2 = 2 * Math.hypot(p2[0], p2[1]);
  return l1 >= l2 ? { a: p1, b: p2, la: l1, lb: l2 } : { a: p2, b: p1, la: l2, lb: l1 };   // a = long half-axis
}

/* ───────── Read the export ───────── */
async function loadData() {
  const el = document.getElementById('house-data');
  const txt = el && el.textContent.trim();
  if (txt) return JSON.parse(txt);
  const r = await fetch('house_export.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('house_export.json: HTTP ' + r.status);
  return r.json();
}
function readHouse(data) {
  const model = data.model || data, states = data.light_states || {};
  const elev = model.floor_elevations || {};
  const floors = [], byId = new Map();
  const addFloor = (raw, id) => {
    const fl = {
      id, name: (raw && raw.name) || id,
      elev: num(elev[raw && raw.id]) ?? num(elev[id]) ?? num(raw && raw.base_elevation_m),
      h: num(raw && raw.floor_to_floor_m) ?? FTF,
      outdoor: /^(outside|outdoors?|garden|yard)$/i.test(id),
    };
    floors.push(fl); byId.set(id, fl);
  };
  for (const f of model.floors || []) { const id = fid(f.id); if (id && !byId.has(id)) addFloor(f, id); }
  const geo = model.room_geometry_m || {};
  for (const g of Object.values(geo)) { const id = fid(g && g.floor_id); if (id && !byId.has(id)) addFloor({ id }, id); }
  let run = 0;   // a floor with no elevation stacks on the ones before it
  for (const fl of floors) { if (fl.elev === null) fl.elev = run; if (!fl.outdoor) run = Math.max(run, fl.elev + fl.h); }
  floors.sort((a, b) => a.elev - b.elev || a.outdoor - b.outdoor);
  const indoor = floors.filter((f) => !f.outdoor).map((f) => f.elev);
  const ground = indoor.length ? Math.min(...indoor) : 0;

  const rooms = [];
  let skippedRooms = 0;
  for (const [name, g] of Object.entries(geo)) {
    const fl = byId.get(fid(g && g.floor_id));
    const pts = g && Array.isArray(g.points_m) ? cleanPoly(g.points_m) : [];
    if (!fl || pts.length < 3) { skippedRooms++; continue; }
    rooms.push({ name, floor: fl, pts, color: roomColor(name, model), outdoor: fl.outdoor || OUTDOOR_RE.test(name), idx: rooms.length, spot: labelSpot(pts) });
  }

  const lights = [];
  let sensors = 0;
  for (const [eid, lp] of Object.entries(model.light_positions_m || {})) {
    if (!eid.startsWith('light.')) { sensors++; continue; }   // motion, temperature, door… share this map; they are not lights
    const fl = byId.get(fid(lp && lp.floor_id)), x = num(lp && lp.x_m), y = num(lp && lp.y_m);
    if (!fl || x === null || y === null) continue;
    const st = states[eid] || {};
    lights.push({
      eid, floor: fl, x, y, name: lp.label || st.name || eid, kind: lightKind(eid, st.name || lp.label || ''),
      fp: footprint(lp), rot: num(lp.rotation) || 0,
      ha: { state: st.state || 'unknown', rgb: st.rgb_color, bri: num(st.brightness), ct: num(st.color_temp_kelvin) },
    });
  }
  return { model, floors, byId, ground, rooms, lights, barriers: model.rf_barriers_m || [], sensors, skippedRooms };
}

/* ───────── Walls from the room outlines ───────── */
function wallPiece(A, p, q, o0, o1, cls, thick, shared) {
  return {
    x0: A.a[0] + A.ux * p + A.nx * o0, y0: A.a[1] + A.uy * p + A.ny * o0,
    x1: A.a[0] + A.ux * q + A.nx * o1, y1: A.a[1] + A.uy * q + A.ny * o1,
    nx: A.nx, ny: A.ny, cls, thick, shared, kind: cls === 'rail' ? 'rail' : 'wall', mat: null, barrier: null,
  };
}
function deriveWalls(fl, rooms, ground) {
  const edges = [];
  for (const r of rooms) {
    const P = r.pts;
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      if (L >= 0.03) edges.push({ room: r, a, b, L, ux: dx / L, uy: dy / L, nx: dy / L, ny: -dx / L });
    }
  }
  const out = [];
  for (const A of edges) {
    // every stretch of A that another room's edge runs along, facing it, within SHARE_TOL
    const ivs = [];
    for (const B of edges) {
      if (B.room === A.room || A.nx * B.nx + A.ny * B.ny > -SHARE_COS) continue;
      const rel = (p) => [(p[0] - A.a[0]) * A.ux + (p[1] - A.a[1]) * A.uy, (p[0] - A.a[0]) * A.nx + (p[1] - A.a[1]) * A.ny];
      const [ta, sa] = rel(B.a), [tb, sb] = rel(B.b);
      const lo = Math.max(0, Math.min(ta, tb)), hi = Math.min(A.L, Math.max(ta, tb));
      if (hi - lo < 0.05) continue;
      const sAt = (t) => sa + (sb - sa) * (t - ta) / (tb - ta);
      const s0 = sAt(lo), s1 = sAt(hi);
      if (Math.abs(s0) > SHARE_TOL || Math.abs(s1) > SHARE_TOL) continue;
      ivs.push({ lo, hi, B: B.room, sAt, d: Math.abs(s0) + Math.abs(s1) });
    }
    const cuts = [0, A.L];
    for (const v of ivs) cuts.push(v.lo, v.hi);
    cuts.sort((p, q) => p - q);
    const segs = [];
    for (let k = 0; k + 1 < cuts.length; k++) {
      const p = cuts[k], q = cuts[k + 1];
      if (q - p < 1e-4) continue;
      const m = (p + q) / 2;
      let best = null;

stage.addEventListener('pointermove', (e) => {
  if (tap && tap.id === e.pointerId && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) tap = null;
  const d = state.drag;
  if (!d || d.id !== e.pointerId) return;
  const hit = floorHit(e.clientX, e.clientY, d.pc.floor.elev);
  if (!hit) return;
  d.pc.x = hit[0] + d.dx; d.pc.y = hit[1] + d.dy;
  placePiece(d.pc);
  requestRender();
}, true);
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (state.drag && state.drag.id === e.pointerId) { state.drag = null; }
  if (!pointers.size) controls.enabled = !bench;
  if (e.type === 'pointerup' && tap && tap.id === e.pointerId && performance.now() - tap.t < 650) {
    const L = pickLight(e.clientX, e.clientY);
    if (L) toggleLight(L);
    else if (!pickPiece(e.clientX, e.clientY) && state.selected) select(null);
  }
  tap = null;
}
stage.addEventListener('pointerup', endPointer, true);
stage.addEventListener('pointercancel', endPointer, true);

/* ───────── UI ───────── */
let toastTimer = 0;
function toast(msg, ms = 2200) {
  const t = $('#toast');
  t.style.bottom = ($('#bottom').offsetHeight + 8) + 'px';
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
const chipBox = $('#floors');
H.floors.filter((f) => !f.outdoor).forEach((fl, i) => {
  chipBox.append(h('button', { 'data-floor': fl.id, 'aria-pressed': 'false', on: { click: () => setTop(fl.id) } },
    h('span', { className: 'dot', style: `background:${FLOOR_DOTS[i % FLOOR_DOTS.length]}` }), fl.name));
});
document.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => applyQuality(b.dataset.q)));
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => preset(b.dataset.view)));
document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => {
  state.wallMode = b.dataset.w;
  document.querySelectorAll('[data-w]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  requestRender();
}));
document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => addPiece(b.dataset.add)));
$('#bench').addEventListener('click', startBench);

/* ───────── Start ───────── */
let q0 = matchMedia('(pointer: coarse)').matches ? 'low' : 'high';
try { const s = localStorage.getItem('liveaboard.quality'); if (s === 'low' || s === 'high') q0 = s; } catch (_) { /* private mode */ }
const indoorFloors = H.floors.filter((f) => !f.outdoor);
setTop((indoorFloors[indoorFloors.length - 1] || H.floors[H.floors.length - 1]).id);
applyQuality(q0);
resize();
preset('iso');
toast('Tap a light to switch it (here only). Drag to turn, right-drag or two fingers to pan, wheel or pinch to zoom.', 5000);

// for the test harness and for poking at it from the console
window.__la = {
  get frames() { return state.frames; },
  info: () => {
    const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
    return {
      gpu: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      floors: H.floors.map((f) => ({ id: f.id, elev: f.elev, h: f.h, outdoor: f.outdoor, rooms: roomsByFloor.get(f).length, wallPieces: f.ui.pieces.length })),
      rooms: H.rooms.length, lights: lights.length, sensorsSkipped: H.sensors, roomsSkipped: H.skippedRooms,
      lightsOn: lights.filter((L) => L.on).length,
      kinds: lights.reduce((a, L) => ((a[L.kind] = (a[L.kind] || 0) + 1), a), {}),
      outside: lights.filter((L) => L.where !== 'in').map((L) => `${L.where}:${L.kind}:${L.name}`),
      walls: floorsUi.reduce((a, F) => a + F.pieces.length, 0),
      barriersOnWalls: floorsUi.reduce((a, F) => a + F.pieces.filter((p) => p.barrier && !p.free).length, 0),
      barriersFree: floorsUi.reduce((a, F) => a + F.pieces.filter((p) => p.free).length, 0),
      calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, quality: state.quality, pieces: pieces.length,
    };
  },
  preset, setTop, applyQuality, fit,
  addPiece: (kind, x, y, rot = 0) => { const pc = addPiece(kind, [x, y]); pc.rot = rot; placePiece(pc); requestRender(); return pc.id; },
  setParam: (k, v) => { const pc = state.selected; if (!pc) return; pc.params[k] = v; buildPiece(pc); openPanel(pc); requestRender(); },
  select: (id) => select(pieces.find((p) => p.id === id) || null),
  look: (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); requestRender(); },
  screen: (x, y, z) => { _v.set(x, y, z).project(camera); const r = canvas.getBoundingClientRect(); return [r.left + (_v.x + 1) / 2 * r.width, r.top + (1 - _v.y) / 2 * r.height]; },
  lightAt: (eid) => { const L = lights.find((l) => l.eid === eid); return L ? { pick: L.pick.map((p) => [p.x, p.y, p.z]), on: L.on, kind: L.kind } : null; },
  pieceAt: (id) => { const p = pieces.find((q) => q.id === id); return p ? { x: p.x, y: p.y, elev: p.floor.elev, rot: p.rot } : null; },
  setWalls: (m) => document.querySelector(`[data-w="${m}"]`).click(),
  tintWalls: () => {   // test aid: outside walls red, inside walls blue, barrier stretches yellow
    for (const F of floorsUi) for (const pc of F.pieces) for (const e of pc.els) {
      if (e.mesh !== F.solid) continue;
      F.solid.setColorAt(e.i, _c.set(pc.barrier ? '#e5c040' : pc.cls === 'ext' ? '#d9534f' : pc.cls === 'int' ? '#4f7dd9' : '#59b36b'));
    }
    floorsUi.forEach((F) => F.solid && (F.solid.instanceColor.needsUpdate = true));
    requestRender();
  },
  ready: true,
};
</script>
</body>
