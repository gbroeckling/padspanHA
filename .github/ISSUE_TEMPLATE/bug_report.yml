name: Bug Report
description: Report a bug in PadSpan HA
labels: ["bug"]
body:
  - type: input
    id: padspan_version
    attributes:
      label: PadSpan HA version
      description: "The version of PadSpan HA you are running (e.g. 0.38.275)."
      placeholder: "0.38.275"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: "The version of Home Assistant Core you are running."
      placeholder: "2026.11.0"
    validations:
      required: true

  - type: dropdown
    id: ble_scanner
    attributes:
      label: Bluetooth receivers
      description: "Which kinds of Bluetooth receiver does PadSpan hear through? Pick every kind you have."
      multiple: true
      options:
        - ESPHome Bluetooth proxy
        - Shelly
        - Home Assistant's own Bluetooth adapter
        - ESPresense
        - Tasmota
        - Other
    validations:
      required: false

  - type: dropdown
    id: bermuda
    attributes:
      label: Is Bermuda installed too?
      description: "Whether the Bermuda integration is also installed on this Home Assistant. PadSpan can run next to it, and it changes where some devices' rooms come from."
      options:
        - "No"
        - "Yes"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What you expected to happen."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Relevant log output from Home Assistant (Settings > System > Logs)."
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "If applicable, add screenshots to help explain the problem."
    validations:
      required: false
