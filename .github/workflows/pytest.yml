name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Several test files (test_device_class_registry.py and others) run a
      # real node subprocess to check cross-file JS/Python contracts, and
      # SKIP rather than FAIL when node isn't on PATH — before this step,
      # they only ran because ubuntu-latest happens to ship node, an
      # undeclared dependency a runner-image change could silently drop.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      # The panel's lint: undeclared names and the other correctness rules
      # listed in eslint.config.mjs, which says why each is there.
      # tests/test_frontend_lint.py runs the same command locally, but skips
      # when eslint can't be fetched; this step fails instead.
      - name: Lint panel JS for undeclared names and other mistakes
        run: npx --yes -p eslint@9 -p globals@17 eslint "custom_components/padspan_ha/www/**/*.js"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      # Undefined names in the Python (ruff F821, F822, F823, nothing else).
      # tests/test_backend_lint.py runs the same check and says why; ruff is
      # pinned in requirements_test.txt, installed above.
      - name: Lint Python for undefined names
        run: python -m ruff check --isolated --no-cache --select F821,F822,F823 .
      # Spread over the runner's cores; pytest-xdist is pinned in
      # requirements_test.txt, installed above.
      - name: Run tests
        run: python -m pytest tests -q -n auto
